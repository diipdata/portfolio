<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1017" />
      <stop offset="50%" stop-color="#141926" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Fundo com cantos arredondados -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  
  <!-- Grid sutil -->
  <path d="M0 80 H400 M0 160 H400 M0 240 H400 M0 320 H400 M80 0 V400 M160 0 V400 M240 0 V400 M320 0 V400" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
  
  <!-- Brilho radial -->
  <circle cx="200" cy="160" r="140" fill="url(#ringGlow)" />
  
  <!-- Moldura externa e interna -->
  <circle cx="200" cy="160" r="92" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85" />
  <circle cx="200" cy="160" r="82" fill="#131722" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Silhueta Minimalista do Criador -->
  <path d="M200 120 C182 120 168 134 168 152 C168 170 182 184 200 184 C218 184 232 170 232 152 C232 134 218 120 200 120 Z" fill="url(#accentGrad)" />
  <path d="M152 226 C152 198 172 188 200 188 C228 188 248 198 248 226 C248 232 242 235 236 235 L164 235 C158 235 152 232 152 226 Z" fill="url(#accentGrad)" opacity="0.9" />
  
  <!-- Badge Monograma 'D' -->
  <circle cx="246" cy="214" r="21" fill="#0b0e17" stroke="url(#cyanGrad)" stroke-width="2.5" />
  <text x="246" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
  
  <!-- Status Online / Dispon?vel -->
  <circle cx="264" cy="116" r="6" fill="#10b981" />
  
  <!-- Textos de Apresenta??o -->
  <text x="200" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">DIEGO</text>
  <text x="200" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#8b5cf6" text-anchor="middle" letter-spacing="1">MOTION &amp; DESIGNER</text>
  <text x="200" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">assets/images/profile/perfil.jpg</text>
</svg>